name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install '.[test]'
      - run: pytest -q
      - name: Validate PostgreSQL migration SQL
        # Offline SQL generation needs the production dialect, not local SQLite.
        # These dummy connection details are never used to open a connection.
        env:
          DATABASE_URL: postgresql+asyncpg://ponyo:ponyo@localhost:5432/ponyo_ci
        run: alembic upgrade head --sql
