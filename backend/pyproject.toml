[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ponyo-api"
version = "0.1.0"
description = "Ponyo FastAPI service for catalog, accounts, orders, and hosted checkout"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pwdlib[argon2]>=0.2.1,<1",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "boto3>=1.37,<2",
  "stripe>=12,<14",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "aiosqlite>=0.21,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
